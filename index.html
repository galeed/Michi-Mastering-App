<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michi Mastering App 🐾</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: rgba(25, 25, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-blue: #00e5ff;
            --text-main: #eaeaea;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 5px;
        }

        .glass-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        audio {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .preset-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-card:hover, .preset-card.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }

        .preset-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .preset-tags {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-desc {
            font-size: 0.95em;
            line-height: 1.5;
            color: #ccc;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 Michi Mastering App</h1>
        <p>Motor de Audio Web - Procesamiento en Tiempo Real</p>
    </div>

    <div class="glass-container">
        <div class="controls">
            <input type="file" id="audioUpload" accept="audio/*" style="color: #fff;">
            <audio id="audioPlayer" controls></audio>
        </div>

        <h2 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px;">Estilos de Masterización</h2>
        <div class="presets-grid" id="presetsContainer">
            <!-- Las tarjetas se inyectarán aquí con JavaScript -->
        </div>
    </div>

    <footer>
        © 2026 Moustache de Chat Lab
    </footer>

    <script>
        // 1. Configuración de Presets (Los 5 actualizados)
        const PRESETS = {
            universal: {
                id: 'universal',
                name: 'Universal',
                emoji: '🌐',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00e5ff, 0 0 15px #00e5ff; font-style: italic; font-weight: 500;">Dinámica natural y balance tonal. Perfecto para unificar elementos de trance y arreglos orquestales con una claridad impecable.</em>',
                tags: 'Trance • Orquestal • All Genres',
                compThreshold: -14, compRatio: 2.2
            },
            fuego: {
                id: 'fuego',
                name: 'Fuego',
                emoji: '🔥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ff0055, 0 0 15px #ff0055; font-style: italic; font-weight: 500;">Graves contundentes y medios definidos. Ideal para hacer que los kicks y bajos del rawstyle y hardstyle destaquen con máxima agresión.</em>',
                tags: 'Rawstyle • Hardstyle • Bass',
                compThreshold: -18, compRatio: 3.5
            },
            cinta: {
                id: 'cinta',
                name: 'Cinta',
                emoji: '📼',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ffaa00, 0 0 15px #ffaa00; font-style: italic; font-weight: 500;">Saturación cálida y dinámica analógica. Excelente para darle textura, saturación y cohesión a pistas de corte industrial.</em>',
                tags: 'Industrial • Vintage • Raw',
                compThreshold: -12, compRatio: 2.0
            },
            espacial: {
                id: 'espacial',
                name: 'Espacial',
                emoji: '🌌',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #b700ff, 0 0 15px #b700ff; font-style: italic; font-weight: 500;">Agudos nítidos y una imagen estéreo expandida. Resalta las atmósferas envolventes y los sintetizadores melódicos del trance.</em>',
                tags: 'Trance • Atmosférico • Melodic',
                compThreshold: -13, compRatio: 2.0
            },
            empuje: {
                id: 'empuje',
                name: 'Empuje',
                emoji: '💥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00ffaa, 0 0 15px #00ffaa; font-style: italic; font-weight: 500;">Máximo impacto rítmico y densidad. Diseñado para potenciar los drops y controlar los transitorios más extremos del hardstyle.</em>',
                tags: 'Hardstyle • Extreme • Punch',
                compThreshold: -16, compRatio: 4.0
            }
            // NOTA: Los otros 8 presets (Estándar, Pulido Pop, Festival EDM, etc.) deben ir aquí.
        };

        // 2. Renderizado de Tarjetas usando innerHTML para leer el estilo
        const container = document.getElementById('presetsContainer');
        
        Object.values(PRESETS).forEach(preset => {
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.id = `card-${preset.id}`;
            
            // Usamos innerHTML para asegurar que las etiquetas <em> brillen
            card.innerHTML = `
                <div class="preset-header">
                    <span>${preset.emoji}</span>
                    <span>${preset.name}</span>
                </div>
                <div class="preset-tags">${preset.tags}</div>
                <div class="preset-desc">${preset.desc}</div>
            `;
            
            card.addEventListener('click', () => applyPreset(preset.id));
            container.appendChild(card);
        });

        // 3. Lógica de Web Audio API
        let audioContext, mediaElementSource, compressor, limiter;
        const audioElement = document.getElementById('audioPlayer');
        const uploadInput = document.getElementById('audioUpload');

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                initAudio();
            }
        });

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                mediaElementSource = audioContext.createMediaElementSource(audioElement);
                
                compressor = audioContext.createDynamicsCompressor();
                limiter = audioContext.createDynamicsCompressor(); // Actúa como hard limiter
                
                // Limiter básico fijo (Brickwall)
                limiter.threshold.value = -0.1;
                limiter.ratio.value = 20.0;
                limiter.attack.value = 0.001;
                limiter.release.value = 0.05;

                mediaElementSource.connect(compressor);
                compressor.connect(limiter);
                limiter.connect(audioContext.destination);
            }
            audioContext.resume();
        }

        function applyPreset(presetId) {
            if (!audioContext) initAudio();
            
            // UI Update
            document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${presetId}`).classList.add('active');

            // Audio Update
            const p = PRESETS[presetId];
            if(compressor) {
                compressor.threshold.setTargetAtTime(p.compThreshold, audioContext.currentTime, 0.1);
                compressor.ratio.setTargetAtTime(p.compRatio, audioContext.currentTime, 0.1);
                console.log(`Aplicado preset: ${p.name}`);
            }
        }
    </script>
</body>
</html>
