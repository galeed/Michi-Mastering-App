<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michi Mastering App 🐾</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: rgba(25, 25, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-blue: #00e5ff;
            --text-main: #eaeaea;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 5px;
        }

        .glass-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        audio {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .preset-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .preset-card:hover, .preset-card.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }

        .preset-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .preset-tags {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-desc {
            font-size: 0.95em;
            line-height: 1.5;
            color: #ccc;
            flex-grow: 1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 Michi Mastering App</h1>
        <p>Procesamiento Web Audio - Moustache de Chat Lab</p>
    </div>

    <div class="glass-container">
        <div class="controls">
            <input type="file" id="audioUpload" accept="audio/*" style="color: #fff;">
            <audio id="audioPlayer" controls></audio>
        </div>

        <h2 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px;">Estilos de Masterización</h2>
        <div class="presets-grid" id="presetsContainer">
            <!-- Tarjetas dinámicas -->
        </div>
    </div>

    <footer>
        © 2026 Moustache de Chat Lab
    </footer>

    <script>
        const PRESETS = {
            // ----- INSPIRADOS EN BANDLAB -----
            universal: {
                id: 'universal',
                name: 'Universal',
                emoji: '🌐',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00e5ff, 0 0 15px #00e5ff; font-style: italic; font-weight: 500;">Dinámica orgánica equilibrada. Integra a la perfección percusiones agresivas y cuerdas sinfónicas sin que compitan entre sí.</em>',
                tags: 'All Genres • Balanced',
                compThreshold: -14, compRatio: 2.2, compAttack: 0.025, compRelease: 0.15
            },
            fuego: {
                id: 'fuego',
                name: 'Fuego',
                emoji: '🔥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ff0055, 0 0 15px #ff0055; font-style: italic; font-weight: 500;">Graves pesados (Punchy Lows). Hace que los kicks y bajos del rawstyle retumben manteniendo la zona media nítida.</em>',
                tags: 'Rawstyle • Hardstyle • Bass',
                compThreshold: -18, compRatio: 3.5, compAttack: 0.015, compRelease: 0.1
            },
            cinta: {
                id: 'cinta',
                name: 'Cinta',
                emoji: '📼',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ffaa00, 0 0 15px #ffaa00; font-style: italic; font-weight: 500;">Saturación cálida vintage. Controla los armónicos punzantes y pega los elementos de sintetizadores industriales con textura analógica.</em>',
                tags: 'Industrial • Vintage • Raw',
                compThreshold: -12, compRatio: 2.0, compAttack: 0.04, compRelease: 0.25
            },
            espacial: {
                id: 'espacial',
                name: 'Espacial',
                emoji: '🌌',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #b700ff, 0 0 15px #b700ff; font-style: italic; font-weight: 500;">Imagen estéreo ultra ancha. Resalta los arpegios de trance y coros etéreos, aportando aire y separación tridimensional.</em>',
                tags: 'Trance • Atmospheric',
                compThreshold: -13, compRatio: 2.0, compAttack: 0.03, compRelease: 0.2
            },
            cinematic: {
                id: 'cinematic',
                name: 'Cinematográfico',
                emoji: '🎬',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #d4af37, 0 0 15px #d4af37; font-style: italic; font-weight: 500;">Preserva el rango dinámico. Deja respirar los crescendos de violines y metales mientras controla sutilmente los clímax.</em>',
                tags: 'Orquestal • Soundtrack',
                compThreshold: -10, compRatio: 1.8, compAttack: 0.05, compRelease: 0.3
            },
            empuje: {
                id: 'empuje',
                name: 'Empuje',
                emoji: '💥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00ffaa, 0 0 15px #00ffaa; font-style: italic; font-weight: 500;">Densidad total y agarre rápido. Ideal para controlar la agresión de los drops y potenciar el impacto de cada transitorio.</em>',
                tags: 'Hardcore • Extreme Punch',
                compThreshold: -16, compRatio: 4.0, compAttack: 0.008, compRelease: 0.08
            },

            // ----- INSPIRADOS EN EASEUS AI MASTERING -----
            pop: {
                id: 'pop',
                name: 'Pop',
                emoji: '🎤',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ff66b2, 0 0 15px #ff66b2; font-style: italic; font-weight: 500;">Claridad vocal y medios brillantes. Inspirado en el motor estándar de Pop sin aplicar alteración inteligente de ganancia.</em>',
                tags: 'Pop • Vocal Focus',
                compThreshold: -12, compRatio: 2.5, compAttack: 0.02, compRelease: 0.15
            },
            edm: {
                id: 'edm',
                name: 'EDM',
                emoji: '⚡',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ffff00, 0 0 15px #ffff00; font-style: italic; font-weight: 500;">Energía de club. Simula la compresión densa de la música electrónica de baile respetando tu volumen de exportación original.</em>',
                tags: 'EDM • Electronic • Dance',
                compThreshold: -15, compRatio: 3.0, compAttack: 0.015, compRelease: 0.1
            }
        };

        const container = document.getElementById('presetsContainer');
        
        Object.values(PRESETS).forEach(preset => {
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.id = `card-${preset.id}`;
            
            card.innerHTML = `
                <div class="preset-header">
                    <span>${preset.emoji}</span>
                    <span>${preset.name}</span>
                </div>
                <div class="preset-tags">${preset.tags}</div>
                <div class="preset-desc">${preset.desc}</div>
            `;
            
            card.addEventListener('click', () => applyPreset(preset.id));
            container.appendChild(card);
        });

        // Motor Web Audio
        let audioContext, mediaElementSource, compressor, limiter;
        const audioElement = document.getElementById('audioPlayer');
        const uploadInput = document.getElementById('audioUpload');

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                initAudio();
            }
        });

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                mediaElementSource = audioContext.createMediaElementSource(audioElement);
                
                compressor = audioContext.createDynamicsCompressor();
                limiter = audioContext.createDynamicsCompressor(); // Limiter de seguridad
                
                // Configuración neutral del Limiter para no inflar artificialmente el volumen
                limiter.threshold.value = -0.1; 
                limiter.ratio.value = 20.0;
                limiter.attack.value = 0.001;
                limiter.release.value = 0.05;

                mediaElementSource.connect(compressor);
                compressor.connect(limiter);
                limiter.connect(audioContext.destination);
            }
            audioContext.resume();
        }

        function applyPreset(presetId) {
            if (!audioContext) initAudio();
            
            document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${presetId}`).classList.add('active');

            const p = PRESETS[presetId];
            if(compressor) {
                // Aplicación de dinámica sin añadir Make-Up Gain artificial
                compressor.threshold.setTargetAtTime(p.compThreshold, audioContext.currentTime, 0.1);
                compressor.ratio.setTargetAtTime(p.compRatio, audioContext.currentTime, 0.1);
                compressor.attack.setTargetAtTime(p.compAttack, audioContext.currentTime, 0.1);
                compressor.release.setTargetAtTime(p.compRelease, audioContext.currentTime, 0.1);
                console.log(`Aplicado preset: ${p.name}`);
            }
        }
    </script>
</body>
</html>
