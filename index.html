<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michi Mastering App 🐾</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: rgba(25, 25, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-blue: #00e5ff;
            --neon-green: #00ffaa;
            --text-main: #eaeaea;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin-bottom: 5px;
        }

        .glass-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .file-upload-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        audio {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }

        .btn-download {
            background: rgba(0, 255, 170, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .btn-download:hover:not(:disabled) {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
        }

        .btn-download:disabled {
            border-color: #555;
            color: #555;
            background: transparent;
            cursor: not-allowed;
            box-shadow: none;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .preset-card {
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .preset-card:hover, .preset-card.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            transform: translateY(-2px);
        }

        .preset-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .preset-tags {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-desc {
            font-size: 0.95em;
            line-height: 1.5;
            color: #ccc;
            flex-grow: 1;
        }
        
        #statusText {
            color: var(--neon-green);
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(0, 255, 170, 0.5);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 Michi Mastering App</h1>
        <p>Procesamiento Web Audio de Alta Fidelidad - Moustache de Chat Lab</p>
    </div>

    <div class="glass-container">
        <div class="controls">
            <div class="file-upload-wrapper">
                <!-- Se amplió el atributo accept para permitir múltiples formatos -->
                <input type="file" id="audioUpload" accept="audio/wav,audio/mp3,audio/flac,audio/ogg,audio/aac,audio/*" style="color: #fff;">
                <button id="btnDownload" class="btn-download" disabled>💾 Exportar Master (WAV 48kHz 24-bit)</button>
            </div>
            <audio id="audioPlayer" controls></audio>
            <div id="statusText"></div>
        </div>

        <h2 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px;">Estilos de Masterización</h2>
        <div class="presets-grid" id="presetsContainer">
            <!-- Tarjetas dinámicas -->
        </div>
    </div>

    <footer>
        © 2026 Moustache de Chat Lab
    </footer>

    <script>
        // PRESETS (Con Make-Up Gain Estático integrado para recuperar volumen)
        const PRESETS = {
            universal: {
                id: 'universal', name: 'Universal', emoji: '🌐',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00e5ff, 0 0 15px #00e5ff; font-style: italic; font-weight: 500;">Dinámica orgánica equilibrada. Integra a la perfección percusiones agresivas y cuerdas sinfónicas.</em>',
                tags: 'All Genres • Balanced',
                compThreshold: -14, compRatio: 2.2, compAttack: 0.025, compRelease: 0.15, makeUpGain: 1.4 // ~ +3dB
            },
            fuego: {
                id: 'fuego', name: 'Fuego', emoji: '🔥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ff0055, 0 0 15px #ff0055; font-style: italic; font-weight: 500;">Graves pesados (Punchy Lows). Hace que los kicks y bajos del rawstyle retumben manteniendo la zona media nítida.</em>',
                tags: 'Rawstyle • Hardstyle • Bass',
                compThreshold: -18, compRatio: 3.5, compAttack: 0.015, compRelease: 0.1, makeUpGain: 1.8 // ~ +5dB
            },
            cinta: {
                id: 'cinta', name: 'Cinta', emoji: '📼',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ffaa00, 0 0 15px #ffaa00; font-style: italic; font-weight: 500;">Saturación cálida vintage. Controla los armónicos punzantes y añade textura analógica a sintetizadores.</em>',
                tags: 'Industrial • Vintage • Raw',
                compThreshold: -12, compRatio: 2.0, compAttack: 0.04, compRelease: 0.25, makeUpGain: 1.3 // ~ +2.5dB
            },
            espacial: {
                id: 'espacial', name: 'Espacial', emoji: '🌌',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #b700ff, 0 0 15px #b700ff; font-style: italic; font-weight: 500;">Imagen estéreo expandida. Resalta arpegios de trance y coros etéreos, aportando aire tridimensional.</em>',
                tags: 'Trance • Atmospheric',
                compThreshold: -13, compRatio: 2.0, compAttack: 0.03, compRelease: 0.2, makeUpGain: 1.4 // ~ +3dB
            },
            cinematic: {
                id: 'cinematic', name: 'Cinematográfico', emoji: '🎬',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #d4af37, 0 0 15px #d4af37; font-style: italic; font-weight: 500;">Preserva el rango dinámico. Deja respirar los crescendos de violines y metales controlando sutilmente los clímax.</em>',
                tags: 'Orquestal • Soundtrack',
                compThreshold: -10, compRatio: 1.8, compAttack: 0.05, compRelease: 0.3, makeUpGain: 1.2 // ~ +1.5dB
            },
            empuje: {
                id: 'empuje', name: 'Empuje', emoji: '💥',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #00ffaa, 0 0 15px #00ffaa; font-style: italic; font-weight: 500;">Densidad total y agarre rápido. Ideal para controlar la agresión de los drops y potenciar el impacto.</em>',
                tags: 'Hardcore • Extreme Punch',
                compThreshold: -16, compRatio: 4.0, compAttack: 0.008, compRelease: 0.08, makeUpGain: 1.6 // ~ +4dB
            },
            pop: {
                id: 'pop', name: 'Pop', emoji: '🎤',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ff66b2, 0 0 15px #ff66b2; font-style: italic; font-weight: 500;">Claridad vocal y medios brillantes. Compresión estándar sin alteración inteligente de ganancia.</em>',
                tags: 'Pop • Vocal Focus',
                compThreshold: -12, compRatio: 2.5, compAttack: 0.02, compRelease: 0.15, makeUpGain: 1.4
            },
            edm: {
                id: 'edm', name: 'EDM', emoji: '⚡',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #ffff00, 0 0 15px #ffff00; font-style: italic; font-weight: 500;">Energía de club. Simula la compresión densa de la música electrónica respetando tu volumen original.</em>',
                tags: 'EDM • Electronic • Dance',
                compThreshold: -15, compRatio: 3.0, compAttack: 0.015, compRelease: 0.1, makeUpGain: 1.5
            }
        },
        
                    dolby: {
                id: 'dolby', name: 'Dolby Spatial', emoji: '🔊',
                desc: '<em style="color: #ffffff; text-shadow: 0 0 8px #0055ff, 0 0 15px #0055ff; font-style: italic; font-weight: 500;">Sonido envolvente y masivo. Maximiza la profundidad y amplitud, dejando que los arreglos orquestales respiren mientras los bajos mantienen su impacto teatral.</em>',
                tags: 'Cinematic • Spatial • Wide Dynamic',
                compThreshold: -16, 
                compRatio: 2.4, 
                compAttack: 0.045, // Ataque lento para dejar pasar los transitorios fuertes
                compRelease: 0.25, // Liberación suave para una sensación de espacio expansivo
                makeUpGain: 1.6 // ~ +4dB para darle ese volumen de sala de cine sin saturar
            };


        const container = document.getElementById('presetsContainer');
        
        Object.values(PRESETS).forEach(preset => {
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.id = `card-${preset.id}`;
            card.innerHTML = `
                <div class="preset-header">
                    <span>${preset.emoji}</span>
                    <span>${preset.name}</span>
                </div>
                <div class="preset-tags">${preset.tags}</div>
                <div class="preset-desc">${preset.desc}</div>
            `;
            card.addEventListener('click', () => applyPreset(preset.id));
            container.appendChild(card);
        });

        // Variables Globales
        let audioContext, mediaElementSource, compressor, makeUpGainNode, limiter;
        let currentFile = null;
        let activePresetId = null;
        
        const audioElement = document.getElementById('audioPlayer');
        const uploadInput = document.getElementById('audioUpload');
        const btnDownload = document.getElementById('btnDownload');
        const statusText = document.getElementById('statusText');

        // Manejo de carga de archivos universales (WAV, MP3, FLAC, etc.)
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentFile = file;
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                
                initAudio();
                
                // Si ya había un preset activo, lo aplicamos al nuevo archivo
                if(activePresetId) {
                    applyPreset(activePresetId);
                }
            }
        });

        function initAudio() {
            if (!audioContext) {
                // Instanciamos el AudioContext en el evento de usuario para evitar bloqueos del navegador
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                mediaElementSource = audioContext.createMediaElementSource(audioElement);
                
                compressor = audioContext.createDynamicsCompressor();
                makeUpGainNode = audioContext.createGain(); // Nodo para volumen estático
                limiter = audioContext.createDynamicsCompressor(); // Limitador brickwall
                
                // Configuración de limitador estricto para evitar clipeo digital (0dBFS)
                limiter.threshold.value = -0.1; 
                limiter.ratio.value = 20.0;
                limiter.attack.value = 0.001;
                limiter.release.value = 0.05;

                // Cadena: Fuente -> Compresor -> Ganancia de Maquillaje -> Limitador -> Salida
                mediaElementSource.connect(compressor);
                compressor.connect(makeUpGainNode);
                makeUpGainNode.connect(limiter);
                limiter.connect(audioContext.destination);
            }
            if(audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function applyPreset(presetId) {
            if (!audioContext) initAudio();
            if (!currentFile) {
                alert("Por favor, carga un archivo de audio primero.");
                return;
            }
            
            activePresetId = presetId;
            document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${presetId}`).classList.add('active');

            const p = PRESETS[presetId];
            if(compressor) {
                // Aplicar valores
                compressor.threshold.setTargetAtTime(p.compThreshold, audioContext.currentTime, 0.1);
                compressor.ratio.setTargetAtTime(p.compRatio, audioContext.currentTime, 0.1);
                compressor.attack.setTargetAtTime(p.compAttack, audioContext.currentTime, 0.1);
                compressor.release.setTargetAtTime(p.compRelease, audioContext.currentTime, 0.1);
                
                // Aplicar el aumento de volumen ESTÁTICO (Make-Up Gain)
                makeUpGainNode.gain.setTargetAtTime(p.makeUpGain, audioContext.currentTime, 0.1);
                
                btnDownload.disabled = false;
                statusText.innerText = `Preset "${p.name}" aplicado. Listo para exportar.`;
            }
        }

        // ==========================================
        // MOTOR DE RENDERIZADO OFFLINE Y EXPORTACIÓN
        // ==========================================
        
        btnDownload.addEventListener('click', async () => {
            if(!currentFile || !activePresetId) return;
            
            statusText.innerText = "⏳ Procesando audio a 48kHz 24-bit... Por favor espera.";
            btnDownload.disabled = true;

            try {
                // 1. Leer archivo
                const arrayBuffer = await currentFile.arrayBuffer();
                
                // 2. Decodificar audio original
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                
                // 3. Crear Contexto Offline para renderizar EXACTAMENTE a 48000 Hz
                const offlineCtx = new OfflineAudioContext(
                    audioBuffer.numberOfChannels, 
                    audioBuffer.duration * 48000, 
                    48000
                );

                // 4. Configurar nodos en el contexto offline
                const source = offlineCtx.createBufferSource();
                source.buffer = audioBuffer;

                const offCompressor = offlineCtx.createDynamicsCompressor();
                const offGain = offlineCtx.createGain();
                const offLimiter = offlineCtx.createDynamicsCompressor();

                const p = PRESETS[activePresetId];
                
                offCompressor.threshold.value = p.compThreshold;
                offCompressor.ratio.value = p.compRatio;
                offCompressor.attack.value = p.compAttack;
                offCompressor.release.value = p.compRelease;
                
                offGain.gain.value = p.makeUpGain;

                offLimiter.threshold.value = -0.1;
                offLimiter.ratio.value = 20.0;
                offLimiter.attack.value = 0.001;
                offLimiter.release.value = 0.05;

                source.connect(offCompressor);
                offCompressor.connect(offGain);
                offGain.connect(offLimiter);
                offLimiter.connect(offlineCtx.destination);

                source.start();

                // 5. Renderizar
                const renderedBuffer = await offlineCtx.startRendering();
                
                // 6. Codificar a WAV 24 bits
                const wavBlob = audioBufferToWav24(renderedBuffer);
                
                // 7. Descargar
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const baseName = currentFile.name.replace(/\.[^/.]+$/, "");
                a.download = `${baseName}_Master_${p.name}.wav`;
                document.body.appendChild(a);
                a.click();
                
                // Limpieza
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    statusText.innerText = "✅ Exportación completada con éxito.";
                    btnDownload.disabled = false;
                }, 100);

            } catch(err) {
                console.error(err);
                statusText.innerText = "❌ Hubo un error al procesar el audio.";
                btnDownload.disabled = false;
            }
        });

        // Codificador de WAV a 24-bits / 48kHz
        function audioBufferToWav24(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate; // 48000
            const length = buffer.length;
            const bitDepth = 24;
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            const byteRate = sampleRate * blockAlign;
            const dataSize = length * blockAlign;
            const bufferSize = 44 + dataSize;
            
            const arrayBuffer = new ArrayBuffer(bufferSize);
            const view = new DataView(arrayBuffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // Header RIFF
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            
            // Header FMT
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true); // Chunk size
            view.setUint16(20, 1, true); // PCM format
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            
            // Chunk de datos
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            // Escribir datos PCM (Convertir Float32 de -1/1 a Int24)
            let offset = 44;
            for (let i = 0; i < length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = buffer.getChannelData(channel)[i];
                    // Evitar clipping
                    sample = Math.max(-1, Math.min(1, sample));
                    
                    // Escalar a 24 bits
                    let val = sample < 0 ? sample * 0x800000 : sample * 0x7FFFFF;
                    
                    // Escribir 3 bytes (Little Endian)
                    view.setInt8(offset, val & 0xFF);
                    view.setInt8(offset + 1, (val >> 8) & 0xFF);
                    view.setInt8(offset + 2, (val >> 16) & 0xFF);
                    offset += 3;
                }
            }
            
            return new Blob([view], { type: 'audio/wav' });
        }
    </script>
    
    <!-- REGISTRO DE SERVICE WORKER PARA MICHI MASTERING APP -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      /* MODIFICAR AQUÍ: Ruta relativa del Service Worker */
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Michi Mastering App lista offline:', reg.scope))
        .catch(err => console.error('Error al registrar SW:', err));
    });
  }
</script>

</body>
